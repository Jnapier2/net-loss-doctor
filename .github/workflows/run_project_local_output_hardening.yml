name: Run corrected NetLossDoctor project-local output hardening

on:
  push:
    branches:
      - agent/project-local-output-hardening-20260810
    paths:
      - .github/workflows/run_project_local_output_hardening.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: netlossdoctor-project-local-output-hardening-corrected
  cancel-in-progress: false

jobs:
  patch-test-and-finalize:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out the dedicated hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/project-local-output-hardening-20260810
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Apply bounded root and output hardening
        run: python .github/scripts/apply_project_local_output_hardening.py

      - name: Correct literal regex quoting in the generated PowerShell test
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path('tests/Test-SafetyContracts.ps1')
          text = path.read_text(encoding='utf-8-sig')
          bad_desktop = 'Assert-True ($engine -notmatch "\\$baseDir = Join-Path \\$desktop \'NetLossDoctor_Reports\'") \'Desktop must not be a final-output fallback.\''
          good_desktop = "Assert-True ($engine -notmatch '\\$baseDir = Join-Path \\$desktop ''NetLossDoctor_Reports''') 'Desktop must not be a final-output fallback.'"
          bad_temp = 'Assert-True ($engine -notmatch "\\$baseDir = Join-Path \\$env:TEMP \'NetLossDoctor_Reports\'") \'OS temp must not be a final-output fallback.\''
          good_temp = "Assert-True ($engine -notmatch '\\$baseDir = Join-Path \\$env:TEMP ''NetLossDoctor_Reports''') 'OS temp must not be a final-output fallback.'"
          for old, new in ((bad_desktop, good_desktop), (bad_temp, good_temp)):
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one generated test line, found {text.count(old)}: {old!r}')
              text = text.replace(old, new, 1)
          normalized = text.replace('\r\n', '\n').replace('\r', '\n')
          path.write_text(normalized, encoding='utf-8', newline='\r\n')
          '@ | python -

      - name: Remove one-use patch assets
        shell: pwsh
        run: |
          Remove-Item -LiteralPath .github/scripts/apply_project_local_output_hardening.py -Force
          Remove-Item -LiteralPath .github/workflows/apply_project_local_output_hardening.yml -Force
          Remove-Item -LiteralPath .github/workflows/run_project_local_output_hardening.yml -Force

      - name: Parse source and run complete safety contracts
        shell: powershell
        run: .\tests\Test-SafetyContracts.ps1

      - name: Verify final public source metadata and write receipt
        shell: pwsh
        run: |
          @'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path.cwd()
          metadata = json.loads((root / 'PUBLIC_SOURCE_METADATA.json').read_text(encoding='utf-8'))
          assert metadata['build_id'] == 'NLD-2.10.0-PUBLIC-20260810-01'
          assert metadata['canonical_entrypoint'] == 'Start-NetLossDoctor.cmd'
          assert metadata['backend_target'] == 'NetLossDoctor.ps1'
          assert metadata['runtime_owned_output_roots'] == ['exports/NetLossDoctor_Reports']
          assert metadata['output_failure_policy'] == 'fail_closed_no_cwd_desktop_or_os_temp_final_output_fallback'
          assert metadata['runtime_identity_gate']['status'] == 'not_implemented_in_public_v2.10.0_source'
          for relative in [
              '.github/scripts/apply_project_local_output_hardening.py',
              '.github/workflows/apply_project_local_output_hardening.yml',
              '.github/workflows/run_project_local_output_hardening.yml',
          ]:
              assert not (root / relative).exists(), relative

          receipt = {
              'schema': 'NetLossDoctor.project_local_output_hardening_receipt.v1',
              'version': metadata['version'],
              'build_id': metadata['build_id'],
              'canonical_entrypoint': metadata['canonical_entrypoint'],
              'backend_target': metadata['backend_target'],
              'runtime_owned_output_roots': metadata['runtime_owned_output_roots'],
              'output_failure_policy': metadata['output_failure_policy'],
              'runtime_identity_gate_status': metadata['runtime_identity_gate']['status'],
              'parameter_package_sha256': metadata['parameter_package_sha256'],
              'files': {
                  name: hashlib.sha256((root / name).read_bytes()).hexdigest()
                  for name in [
                      'NetLossDoctor.ps1',
                      'PUBLIC_SOURCE_METADATA.json',
                      'README.md',
                      'Start-NetLossDoctor.cmd',
                      'tests/Test-SafetyContracts.ps1',
                  ]
              },
              'rights_notice': 'Copyright © 2026 Gateway Information Group LLC. All rights reserved.',
          }
          destination = Path(os.environ['RUNNER_TEMP']) / 'NetLossDoctor_v2.10.0_project_local_output_hardening_receipt.json'
          destination.write_text(json.dumps(receipt, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(json.dumps(receipt, indent=2, ensure_ascii=False))
          '@ | python -
          git diff --check

      - name: Upload bounded hardening evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: netlossdoctor-output-hardening-${{ github.run_id }}
          path: ${{ runner.temp }}/NetLossDoctor_v2.10.0_project_local_output_hardening_receipt.json
          if-no-files-found: error
          compression-level: 9
          retention-days: 14

      - name: Commit only the verified final source tree
        shell: pwsh
        run: |
          git add -A
          if (git diff --cached --quiet) {
            throw 'The output-hardening pass produced no reviewable source changes.'
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $body = @'
          Remove caller-working-directory, Desktop, and operating-system-temp final-output fallbacks; retain the stable Start-NetLossDoctor.cmd entrypoint; add explicit public source metadata and cross-working-directory verification; and preserve the read-only v2.10.0 diagnostic behavior.

          Copyright © 2026 Gateway Information Group LLC. All rights reserved.
          '@
          git commit -m "Keep NetLossDoctor final outputs project-local" -m $body
          git push origin HEAD:agent/project-local-output-hardening-20260810

# Copyright © 2026 Gateway Information Group LLC. All rights reserved.
